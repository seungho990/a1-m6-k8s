replicaCount: 1
image:
  repository: ghcr.io/YOUR-OWNER/YOUR-REPO
  tag: "REPLACE_WITH_GIT_SHA"
  pullPolicy: IfNotPresent
imagePullSecrets: []
service:
  port: 80
ingress:
  enabled: false
  className: traefik
  host: m6.example.invalid   # 본인 도메인으로 변경 후 TLS 설정
resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi
existingSecret: a1-m6-app-secrets
